spring.application.name=agenda-salao-escola
server.port=${PORT:8080}

# Lê o arquivo .env local (se existir) como fonte de propriedades. Em produção (Azure App Service)
# não há .env: os valores vêm das variáveis de ambiente do processo, que têm precedência.
spring.config.import=optional:file:.env[.properties]

# ---- Banco de dados (nenhuma credencial fica no código) ----
# DATABASE_URL vem do ambiente/.env. O padrão abaixo é só um H2 local em arquivo, sem segredo.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./dados/agenda;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
# Falha rápido quando o banco está fora (o /health responde 503 em ~5 s em vez de ~30 s).
spring.datasource.hikari.connection-timeout=5000

# ---- Scripts SQL (fonte única em banco/, empacotada no classpath pelo pom.xml) ----
# Ambos são idempotentes (IF NOT EXISTS / WHERE NOT EXISTS), então podem rodar a cada inicialização.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:banco/schema.sql
spring.sql.init.data-locations=classpath:banco/dados-iniciais.sql
spring.sql.init.encoding=UTF-8

# O schema pertence a banco/schema.sql; o Hibernate não cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Console web do H2 (ADR-007). Desligado por padrão; ligue só em desenvolvimento via .env.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
